<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 330" width="1000" height="330" font-family="Segoe UI, Arial, sans-serif">
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#374151"/></marker></defs>
<rect width="1000" height="330" fill="#ffffff"/>
<text x="500.0" y="30" text-anchor="middle" font-size="20" font-weight="700" fill="#111827">Notebooks 2 &amp; 3: Vector Search Pipeline</text>
<rect x="20" y="90" width="170" height="100" rx="10" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/><text x="105.0" y="127.0" text-anchor="middle" font-size="14" font-weight="700" fill="#111827">1. Embed + store</text><text x="105.0" y="145.0" text-anchor="middle" font-size="12" font-weight="400" fill="#111827">AOAI ada-02 -> Blob</text><text x="105.0" y="163.0" text-anchor="middle" font-size="12" font-weight="400" fill="#111827">(.txt, .pkl, metadata.pkl)</text><line x1="190" y1="140" x2="215" y2="140" stroke="#374151" stroke-width="2" marker-end="url(#a)"/><rect x="215" y="90" width="170" height="100" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="300.0" y="127.0" text-anchor="middle" font-size="14" font-weight="700" fill="#111827">2. Create index</text><text x="300.0" y="145.0" text-anchor="middle" font-size="12" font-weight="400" fill="#111827">content_vector 1536-d</text><text x="300.0" y="163.0" text-anchor="middle" font-size="12" font-weight="400" fill="#111827">HNSW profile</text><line x1="385" y1="140" x2="410" y2="140" stroke="#374151" stroke-width="2" marker-end="url(#a)"/><rect x="410" y="90" width="170" height="100" rx="10" fill="#ffedd5" stroke="#ea580c" stroke-width="2"/><text x="495.0" y="127.0" text-anchor="middle" font-size="14" font-weight="700" fill="#111827">3. Load from Blob</text><text x="495.0" y="145.0" text-anchor="middle" font-size="12" font-weight="400" fill="#111827">texts, embeddings,</text><text x="495.0" y="163.0" text-anchor="middle" font-size="12" font-weight="400" fill="#111827">metadata</text><line x1="580" y1="140" x2="605" y2="140" stroke="#374151" stroke-width="2" marker-end="url(#a)"/><rect x="605" y="90" width="170" height="100" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="690.0" y="127.0" text-anchor="middle" font-size="14" font-weight="700" fill="#111827">4. Upload docs</text><text x="690.0" y="145.0" text-anchor="middle" font-size="12" font-weight="400" fill="#111827">+ content_vector</text><text x="690.0" y="163.0" text-anchor="middle" font-size="12" font-weight="400" fill="#111827">to AI Search</text><line x1="775" y1="140" x2="800" y2="140" stroke="#374151" stroke-width="2" marker-end="url(#a)"/><rect x="800" y="90" width="170" height="100" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/><text x="885.0" y="127.0" text-anchor="middle" font-size="14" font-weight="700" fill="#111827">5. Query</text><text x="885.0" y="145.0" text-anchor="middle" font-size="12" font-weight="400" fill="#111827">embed query -> </text><text x="885.0" y="163.0" text-anchor="middle" font-size="12" font-weight="400" fill="#111827">VectorizedQuery k=2</text><rect x="20" y="240" width="940" height="60" rx="10" fill="#f3f4f6" stroke="#6b7280" stroke-width="2"/><text x="490.0" y="275.0" text-anchor="middle" font-size="14" font-weight="700" fill="#111827">Output: top-k docs ranked by cosine similarity: text, title, author, date, category, summary, score</text></svg>