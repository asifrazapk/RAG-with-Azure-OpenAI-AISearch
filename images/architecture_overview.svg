<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 410" width="980" height="410" font-family="Segoe UI, Arial, sans-serif">
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#374151"/></marker></defs>
<rect width="980" height="410" fill="#ffffff"/>
<text x="490.0" y="30" text-anchor="middle" font-size="20" font-weight="700" fill="#111827">RAG on Azure: Overall Architecture</text>
<rect x="20" y="50" width="300" height="250" rx="12" fill="none" stroke="#9ca3af" stroke-dasharray="6 4"/><text x="32" y="70" font-size="13" font-weight="700" fill="#6b7280">Phase 1: Ingestion</text><rect x="340" y="50" width="300" height="250" rx="12" fill="none" stroke="#9ca3af" stroke-dasharray="6 4"/><text x="352" y="70" font-size="13" font-weight="700" fill="#6b7280">Phase 2: Indexing</text><rect x="660" y="50" width="300" height="250" rx="12" fill="none" stroke="#9ca3af" stroke-dasharray="6 4"/><text x="672" y="70" font-size="13" font-weight="700" fill="#6b7280">Phase 3: Retrieval</text><rect x="50" y="90" width="240" height="60" rx="10" fill="#f3f4f6" stroke="#6b7280" stroke-width="2"/><text x="170.0" y="116.0" text-anchor="middle" font-size="14" font-weight="700" fill="#111827">Source documents</text><text x="170.0" y="134.0" text-anchor="middle" font-size="12" font-weight="400" fill="#111827">texts + metadata / .txt files</text><rect x="50" y="190" width="240" height="70" rx="10" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/><text x="170.0" y="221.0" text-anchor="middle" font-size="14" font-weight="700" fill="#111827">Azure OpenAI</text><text x="170.0" y="239.0" text-anchor="middle" font-size="12" font-weight="400" fill="#111827">text-embedding-ada-002 (1536-d)</text><rect x="370" y="90" width="240" height="60" rx="10" fill="#ffedd5" stroke="#ea580c" stroke-width="2"/><text x="490.0" y="116.0" text-anchor="middle" font-size="14" font-weight="700" fill="#111827">Azure Blob Storage</text><text x="490.0" y="134.0" text-anchor="middle" font-size="12" font-weight="400" fill="#111827">document_i.txt, embedding_i.pkl</text><rect x="370" y="190" width="240" height="70" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="490.0" y="221.0" text-anchor="middle" font-size="14" font-weight="700" fill="#111827">Azure AI Search</text><text x="490.0" y="239.0" text-anchor="middle" font-size="12" font-weight="400" fill="#111827">Index: HNSW vector + text fields</text><rect x="690" y="90" width="240" height="60" rx="10" fill="#f3f4f6" stroke="#6b7280" stroke-width="2"/><text x="810.0" y="116.0" text-anchor="middle" font-size="14" font-weight="700" fill="#111827">User query</text><text x="810.0" y="134.0" text-anchor="middle" font-size="12" font-weight="400" fill="#111827">e.g. 'climate change impact'</text><rect x="690" y="190" width="240" height="70" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/><text x="810.0" y="221.0" text-anchor="middle" font-size="14" font-weight="700" fill="#111827">Top-k results</text><text x="810.0" y="239.0" text-anchor="middle" font-size="12" font-weight="400" fill="#111827">content, metadata, @search.score</text><line x1="170" y1="150" x2="170" y2="190" stroke="#374151" stroke-width="2" marker-end="url(#a)"/><text x="176.0" y="164.0" font-size="11" fill="#374151">embed</text><line x1="290" y1="225" x2="370" y2="125" stroke="#374151" stroke-width="2" marker-end="url(#a)"/><text x="336.0" y="169.0" font-size="11" fill="#374151">save</text><line x1="490" y1="150" x2="490" y2="190" stroke="#374151" stroke-width="2" marker-end="url(#a)"/><text x="496.0" y="164.0" font-size="11" fill="#374151">load + upload</text><line x1="810" y1="150" x2="810" y2="190" stroke="#374151" stroke-width="2" marker-end="url(#a)"/><text x="816.0" y="164.0" font-size="11" fill="#374151">search</text><line x1="610" y1="225" x2="690" y2="225" stroke="#374151" stroke-width="2" marker-end="url(#a)" stroke-dasharray="6 4"/><rect x="690" y="320" width="240" height="60" rx="10" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/><text x="810.0" y="346.0" text-anchor="middle" font-size="14" font-weight="700" fill="#111827">Azure OpenAI (query embed)</text><text x="810.0" y="364.0" text-anchor="middle" font-size="12" font-weight="400" fill="#111827">same model as ingestion</text><line x1="810" y1="260" x2="810" y2="320" stroke="#374151" stroke-width="2" marker-end="url(#a)"/></svg>